name: NightSync development builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android emulator UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          disable-animations: true
          script: cd mobile/android && gradle --no-daemon connectedDebugAndroidTest
        env:
          ANDROID_SERIAL: emulator-5554
      - name: Build Android APK
        working-directory: mobile/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NightSync-Android
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows client
        run: dotnet publish desktop/windows/NightSync.Desktop/NightSync.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/NightSync-Windows
      - name: Smoke test Windows client launch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path "artifacts/NightSync-Windows/NightSync.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()
          if ($process.HasExited) { throw "NightSync Windows client exited during startup." }
          Stop-Process -Id $process.Id -Force
          Write-Host "NightSync Windows client remained running after launch."

      - uses: actions/upload-artifact@v4
        with:
          name: NightSync-Windows
          path: artifacts/NightSync-Windows/**
          if-no-files-found: error
          retention-days: 14

  server:
    name: Build single NightSync Server app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Resolve Go dependencies
        working-directory: server
        run: go mod tidy
      - name: Test server API
        working-directory: server
        run: go test ./...
      - name: Build embedded server engine
        shell: pwsh
        working-directory: server
        run: |
          $resourceDir = "../desktop/windows/NightSync.ServerUI/Resources"
          New-Item -ItemType Directory -Force -Path $resourceDir | Out-Null
          go build -trimpath -ldflags="-s -w" -o "$resourceDir/NightSync.Server.Engine.exe" ./cmd/nightsync-server
      - name: Smoke test Windows background service
        shell: pwsh
        working-directory: server
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path "../desktop/windows/NightSync.ServerUI/Resources/NightSync.Server.Engine.exe").Path
          $data = Join-Path $env:RUNNER_TEMP "NightSync-Service-Smoke"
          $log = Join-Path $env:RUNNER_TEMP "NightSync-Service-Smoke.log"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $binPath = "`"$exe`" --storage `"$data`" --log-file `"$log`""
          sc.exe create NightSyncSmoke binPath= $binPath start= demand obj= LocalSystem
          if ($LASTEXITCODE -ne 0) { throw "Could not register the NightSync service smoke test." }
          try {
            sc.exe start NightSyncSmoke
            if ($LASTEXITCODE -ne 0) { throw "Windows could not start the NightSync service." }
            $healthy = $false
            for ($i = 0; $i -lt 24; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8787/health"
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch {}
            }
            if (-not $healthy) {
              if (Test-Path $log) { Get-Content $log }
              throw "NightSync service did not expose a healthy local endpoint."
            }
          } finally {
            sc.exe stop NightSyncSmoke | Out-Null
            $stopped = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              $state = (sc.exe query NightSyncSmoke 2>&1 | Out-String)
              Write-Host $state
              if ($state.Contains("STOPPED")) { $stopped = $true; break }
            }
            if (-not $stopped) { throw "NightSync service did not reach the STOPPED state." }
            sc.exe delete NightSyncSmoke | Out-Null
          }
      - name: Publish single Server app
        run: dotnet publish desktop/windows/NightSync.ServerUI/NightSync.ServerUI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/NightSync-Server
      - uses: actions/upload-artifact@v4
        with:
          name: NightSync-Server
          path: artifacts/NightSync-Server/NightSync.Server.exe
          if-no-files-found: error
          retention-days: 14
