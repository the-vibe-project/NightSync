name: NightSync development builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: mobile/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NightSync-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows x64
        run: dotnet publish desktop/windows/NightSync.Desktop/NightSync.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/NightSync-Windows
      - uses: actions/upload-artifact@v4
        with:
          name: NightSync-Windows-x64
          path: artifacts/NightSync-Windows/**
          if-no-files-found: error
          retention-days: 14

  server:
    name: Build Windows server executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Resolve Go dependencies and generate checksums
        working-directory: server
        run: go mod tidy
      - name: Build server
        shell: pwsh
        working-directory: server
        run: |
          New-Item -ItemType Directory -Force -Path ../artifacts | Out-Null
          go build -trimpath -ldflags="-s -w" -o ../artifacts/NightSync-Server-windows-x64.exe ./cmd/nightsync-server
      - name: Smoke test Windows service start and stop
        shell: pwsh
        working-directory: server
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path "../artifacts/NightSync-Server-windows-x64.exe").Path
          $data = Join-Path $env:RUNNER_TEMP "NightSync-Service-Smoke"
          $log = Join-Path $env:RUNNER_TEMP "NightSync-Service-Smoke.log"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $binPath = "`"$exe`" --storage `"$data`" --log-file `"$log`""
          sc.exe create NightSync binPath= $binPath start= demand obj= LocalSystem
          if ($LASTEXITCODE -ne 0) { throw "Could not register the NightSync smoke-test service." }
          try {
            sc.exe start NightSync
            if ($LASTEXITCODE -ne 0) { throw "Windows could not start the NightSync service." }
            $healthy = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8787/health"
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch {}
            }
            if (-not $healthy) {
              if (Test-Path $log) { Get-Content $log }
              throw "NightSync service did not expose a healthy local endpoint."
            }
          } finally {
            sc.exe stop NightSync | Out-Null
            $stopped = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              $state = (sc.exe query NightSync 2>&1 | Out-String)
              Write-Host $state
              if ($state.Contains("STOPPED")) { $stopped = $true; break }
            }
            if (-not $stopped) { throw "NightSync service did not reach the STOPPED state." }
            sc.exe delete NightSync | Out-Null
          }
      - uses: actions/upload-artifact@v4
        with:
          name: NightSync-Server-windows-x64
          path: artifacts/NightSync-Server-windows-x64.exe
          if-no-files-found: error
          retention-days: 14

  server-ui:
    name: Build NightSync Server graphical app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish NightSync Server UI
        run: dotnet publish desktop/windows/NightSync.ServerUI/NightSync.ServerUI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/NightSync-Server-UI
      - uses: actions/upload-artifact@v4
        with:
          name: NightSync-Server-UI-windows-x64
          path: artifacts/NightSync-Server-UI/**
          if-no-files-found: error
          retention-days: 14
