name: Sign Windows release artifact

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "GitHub Actions run ID that produced the unsigned Windows artifact"
        required: true
        type: string
      artifact_name:
        description: "Windows artifact from the successful main-branch build"
        required: true
        default: "NightSync-Windows"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    name: Authenticode sign and verify
    environment: windows-signing
    runs-on: windows-latest
    steps:
      - name: Check out signing script from main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check signing secrets
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
            throw "Configure WINDOWS_SIGNING_PFX_BASE64 and WINDOWS_SIGNING_PFX_PASSWORD as secrets in the protected windows-signing environment."
          }

      - name: Verify source workflow run and artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          if ($env:SOURCE_RUN_ID -notmatch '^\d+$') {
            throw "Source run ID must contain digits only."
          }
          $allowedArtifacts = @("NightSync-Windows", "NightSync-Server")
          if ($allowedArtifacts -notcontains $env:SOURCE_ARTIFACT_NAME) {
            throw "Only NightSync-Windows or NightSync-Server artifacts may be signed."
          }

          $runPath = "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID"
          $sourceRun = gh api $runPath | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Could not retrieve the source workflow run."
          }
          if ($sourceRun.status -ne "completed" -or $sourceRun.conclusion -ne "success") {
            throw "Only artifacts from a completed, successful workflow run may be signed."
          }
          if ($sourceRun.head_branch -ne "main" -or
              $sourceRun.head_repository.full_name -ne $env:GITHUB_REPOSITORY) {
            throw "Only builds from this repository's main branch may be signed."
          }
          if ($sourceRun.path -ne ".github/workflows/build.yml" -or
              @("push", "workflow_dispatch") -notcontains $sourceRun.event) {
            throw "The source must be a main-branch NightSync development build triggered by push or workflow_dispatch."
          }

      - name: Download unsigned Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: unsigned-artifact

      - name: Prepare signing certificate
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "nightsync-code-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          "WINDOWS_SIGNING_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign and verify Windows binaries
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_CERT_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_CERT_THUMBPRINT }}
        run: |
          ./scripts/sign-windows-artifacts.ps1 -Path "unsigned-artifact" -PfxPath "$env:WINDOWS_SIGNING_PFX_PATH"

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-signed
          path: unsigned-artifact/
          if-no-files-found: error
          retention-days: 30
