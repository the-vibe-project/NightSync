name: Sign Windows release artifact

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "GitHub Actions run ID that produced the unsigned Windows artifact"
        required: true
        type: string
      artifact_name:
        description: "Artifact name from that run (for example, NightSync-Windows)"
        required: true
        default: "NightSync-Windows"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  sign:
    name: Authenticode sign and verify
    runs-on: windows-latest
    steps:
      - name: Check signing secrets
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: \${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: \${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
            throw "Configure WINDOWS_SIGNING_PFX_BASE64 and WINDOWS_SIGNING_PFX_PASSWORD in repository Actions secrets before signing."
          }

      - name: Download unsigned Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: \${{ inputs.artifact_name }}
          run-id: \${{ inputs.source_run_id }}
          github-token: \${{ secrets.GITHUB_TOKEN }}
          path: unsigned-artifact

      - name: Prepare signing certificate
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: \${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "nightsync-code-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          "WINDOWS_SIGNING_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign and verify Windows binaries
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_PASSWORD: \${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_CERT_THUMBPRINT: \${{ secrets.WINDOWS_SIGNING_CERT_THUMBPRINT }}
        run: |
          ./scripts/sign-windows-artifacts.ps1 -Path "unsigned-artifact" -PfxPath "$env:WINDOWS_SIGNING_PFX_PATH"

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: \${{ inputs.artifact_name }}-signed
          path: unsigned-artifact/
          if-no-files-found: error
          retention-days: 30
